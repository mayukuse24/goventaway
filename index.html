<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoVentAway</title>
  <meta name="description" content="A safe space to vent and feel heard." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- React 18 production builds (smaller than dev) -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #f5efe0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-80px) scale(1.5); opacity: 0; }
    }
    @keyframes shake {
      0%,100% { transform: translateX(0) rotate(0deg); }
      10% { transform: translateX(-8px) rotate(-3deg); }
      20% { transform: translateX(8px) rotate(3deg); }
      30% { transform: translateX(-8px) rotate(-2deg); }
      40% { transform: translateX(8px) rotate(2deg); }
      50% { transform: translateX(-4px) rotate(-1deg); }
      60% { transform: translateX(4px) rotate(1deg); }
      70% { transform: translateX(-2px); }
      80% { transform: translateX(2px); }
      90% { transform: translateX(-1px); }
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-20px) scale(1.1); }
      60% { transform: translateY(-8px) scale(1.05); }
    }
    @keyframes spinDizzy {
      0% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(90deg) scale(0.9); }
      50% { transform: rotate(180deg) scale(1.1); }
      75% { transform: rotate(270deg) scale(0.9); }
      100% { transform: rotate(360deg) scale(1); }
    }
    @keyframes splat {
      0% { transform: scale(1); }
      15% { transform: scale(1.3, 0.7); }
      30% { transform: scale(0.8, 1.2); }
      45% { transform: scale(1.15, 0.85); }
      65% { transform: scale(0.95, 1.05); }
      100% { transform: scale(1); }
    }
    @keyframes crying {
      0%,100% { transform: translateY(0); }
      25% { transform: translateY(-3px); }
      75% { transform: translateY(3px); }
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    @keyframes meterFill {
      from { width: 0%; }
    }
    @keyframes starPop {
      0% { transform: scale(0) rotate(-20deg); opacity: 0; }
      70% { transform: scale(1.3) rotate(5deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    @keyframes pieThrow {
      0% { transform: translate(60px, -60px) scale(0) rotate(-90deg); opacity: 0; }
      50% { transform: translate(10px, -10px) scale(1.2) rotate(20deg); opacity: 1; }
      100% { transform: translate(0,0) scale(1) rotate(0deg); opacity: 1; }
    }
    @keyframes hairShave {
      0% { height: 30px; }
      100% { height: 0px; }
    }
    @keyframes poopDrop {
      0% { transform: translateY(-40px) scale(0); opacity: 0; }
      70% { transform: translateY(5px) scale(1.1); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }
    @keyframes scaleIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes glowPulse {
      0%,100% { box-shadow: 0 0 20px rgba(184,109,0,0.15); }
      50% { box-shadow: 0 0 40px rgba(184,109,0,0.35), 0 0 60px rgba(212,136,10,0.15); }
    }
    @keyframes typewriter {
      from { width: 0; }
      to { width: 100%; }
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Pre-compiled JS (compiled from .jsx via Babel; no in-browser transform). Order matters. -->
  <script src="js/ios-frame.js"></script>
  <script src="js/tweaks-panel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
