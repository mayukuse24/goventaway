<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoVentAway — Page not found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: linear-gradient(160deg, #fdf6e3 0%, #f5efe0 60%, #faecd4 100%);
      font-family: 'Nunito', sans-serif;
      color: #2d1a00;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    .card {
      max-width: 420px; text-align: center;
      background: #fdf6e3; border-radius: 24px; padding: 40px 28px;
      box-shadow: 0 20px 60px rgba(184,109,0,0.12);
      border: 1px solid rgba(184,109,0,0.08);
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 80px; font-weight: 700; line-height: 1;
      background: linear-gradient(135deg, #b86d00 0%, #d4880a 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    h2 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    p { color: #8a6030; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
    a {
      display: inline-block; padding: 13px 24px; border-radius: 14px;
      background: linear-gradient(135deg, #b86d00 0%, #d4880a 100%);
      color: #fff; text-decoration: none; font-weight: 800; font-size: 15px;
      box-shadow: 0 6px 20px rgba(184,109,0,0.25);
    }
    .hint { font-size: 12px; color: #b39065; margin-top: 18px; }
  </style>
  <!-- Auto-redirect after 2.5s. On GitHub Pages project sites the URL is
       /<repo>/<missing-path> — we strip everything after the first segment
       so /<repo>/ resolves correctly. -->
  <script>
    setTimeout(function () {
      var parts = location.pathname.split('/').filter(Boolean);
      location.href = parts.length > 0 ? '/' + parts[0] + '/' : '/';
    }, 2500);
  </script>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <h2>This page took a vent break 💨</h2>
    <p>The page you're looking for isn't here. Let's get you back somewhere comfy.</p>
    <a href="./">Go to GoVentAway</a>
    <div class="hint">redirecting in a moment…</div>
  </div>
</body>
</html>
